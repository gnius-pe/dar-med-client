<div class="page-wrapper">
  <div class="content">
    <!-- Page Header -->
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Citas </a></li>
            <li class="breadcrumb-item"><i class="feather icon-chevron-right"></i></li>
            <li class="breadcrumb-item active">Editar cita #{{ appointmentId }}</li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->
    <div class="row">
      <div class="col-sm-12">
        <app-appointment-form
          [appointmentToEdit]="appointmentData"
          [isEditMode]="true"
          (updateAppointment)="onAppointmentUpdate($event)"
          (showError)="onAppointmentError($event)">
        </app-appointment-form>
      </div>
    </div>
  </div>
</div>

<app-notification
  [show]="showNotification"
  [message]="notificationMessage"
  [type]="notificationType"
  [duration]="3000"
  (close)="onNotificationClose()">
</app-notification>

<app-loading-overlay [isBlock]="isLoading"></app-loading-overlay>
