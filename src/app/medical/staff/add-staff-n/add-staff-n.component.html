<div class="page-wrapper">
  <div class="content">

    <!-- Page Header -->
    <div class="page-header">
      <div class="row">
        <div class="col-sm-12">
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="#">Personal </a></li>
            <li class="breadcrumb-item"><i class="feather icon-chevron-right"></i></li>
            <li class="breadcrumb-item active">Añadir personal</li>
          </ul>
        </div>
      </div>
    </div>
    <!-- /Page Header -->
    <div class="row">
      <div class="col-sm-12">

        <div class="card">
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-12">
                  <div class="form-heading">
                    <h4>Añadir personal</h4>
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Nombre<span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="name" name="name" type="text">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Apellido<span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="surname" name="surname" type="text">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Celular <span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="mobile" name="mobile" type="text">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group local-forms">
                    <label>Email <span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="email" name="email" type="email">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group local-forms">
                    <label>Contraseña <span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="password" name="password" type="password">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group local-forms">
                    <label>Confirmar contraseña<span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="password_confirmation" name="password_confirmation"
                           type="password">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group local-forms">
                    <label>Fecha de nacimiento <span class="login-danger">*</span></label>
                    <input
                      class="form-control datetimepicker"
                      [(ngModel)]="birth_date"
                      name="birth_date"
                      type="text"
                      [matDatepicker]="picker"
                      placeholder="DD/MM/YYYY">
                    <mat-datepicker #picker></mat-datepicker>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group select-gender">
                    <label class="gen-label">Genero<span class="login-danger">*</span></label>
                    <div class="form-check-inline">
                      <label class="form-check-label">
                        <input type="radio" name="gender" value="1" [(ngModel)]="gender" class="form-check-input">Male
                      </label>
                    </div>
                    <div class="form-check-inline">
                      <label class="form-check-label">
                        <input type="radio" name="gender" value="2" [(ngModel)]="gender" class="form-check-input">Female
                      </label>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Educación <span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="education" name="education" type="text">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Designación <span class="login-danger">*</span></label>
                    <input class="form-control" [(ngModel)]="designation" name="designation" type="text">
                  </div>
                </div>
                <div class="col-12 col-md-6 col-xl-4">
                  <div class="form-group local-forms">
                    <label>Roles <span class="login-danger">*</span></label>
                    <mat-select [(ngModel)]="selectedValue" [ngModelOptions]="{standalone: true}"
                                class="form-control select" placeholder="Select  Role">
                      <mat-option *ngFor="let data of roles" [value]="data.id">
                        {{ data.name }}
                      </mat-option>
                    </mat-select>
                  </div>
                </div>
                <div class="col-12 col-sm-12">
                  <div class="form-group local-forms">
                    <label>Dirección <span class="login-danger">*</span></label>
                    <textarea class="form-control" [(ngModel)]="address" name="address" rows="3" cols="30"></textarea>
                  </div>
                </div>

                <div class="col-12 col-md-6 col-xl-6">
                  <div class="form-group local-top-form">
                    <label class="local-top">Avatar(Opcional)</label>
                    <div class="settings-btn upload-files-avator">
                      <input type="file" accept="image/*" name="image" id="file" (change)="loadFile($event)"
                             class="hide-input">
                      <label for="file" class="upload">Elegir imagen</label>
                    </div>
                  </div>
                  <div class="" *ngIf="FILE_AVATAR">
                    <img [src]="IMAGEN_PREVIZUALIZA" width="250" alt="" srcset="">
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-group row my-4" *ngIf="text_success">
                    <div class="col-md-8">
                      <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <strong>Exito!</strong> {{ text_success }}.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
                          <span aria-hidden="true"> </span>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="form-group row my-4" *ngIf="text_validation">
                    <div class="col-md-8">
                      <div class="alert alert-warning alert-dismissible fade show" role="alert">
                        <strong>!</strong> {{ text_validation }}.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
                          <span aria-hidden="true"> </span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="col-12">
                  <div class="doctor-submit text-end">
                    <button type="button" (click)="save()" class="btn btn-primary submit-form me-2">Guardar</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-loading-overlay [isBlock]="isLoading"></app-loading-overlay>

<app-notification
  [show]="showNotification"
  [message]="notificationMessage"
  [type]="notificationType"
  [duration]="3000"
  (close)="onNotificationClose()">
</app-notification>
