<div class="card">
  <div class="card-body">
    <form [formGroup]="doctorForm">
      <div class="row">
        <div class="col-12">
          <div class="form-heading">
            <h4>Añadir doctor</h4>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Nombre <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="name" type="text">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Apellido <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="surname" type="text">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Celular <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="phone" type="text">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group local-forms">
            <label>Email <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="email" type="email">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group local-forms">
            <label>Contraseña <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="password" type="password">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group local-forms">
            <label>Confirmar contraseña <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="password_confirmation" type="password">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group local-forms">
            <label>Fecha de nacimiento <span class="login-danger">*</span></label>
            <input class="form-control datetimepicker" formControlName="birth_date" type="text" matInput [matDatepicker]="picker">
            <mat-datepicker #picker></mat-datepicker>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group select-gender">
            <label class="gen-label">Genero<span class="login-danger">*</span></label>
            <div class="form-check-inline">
              <label class="form-check-label">
                <input type="radio" formControlName="gender" value="1" class="form-check-input">Male
              </label>
            </div>
            <div class="form-check-inline">
              <label class="form-check-label">
                <input type="radio" formControlName="gender" value="2" class="form-check-input">Female
              </label>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Educación <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="education" type="text">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Designation <span class="login-danger">*</span></label>
            <input class="form-control" formControlName="designation" type="text">
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Roles <span class="login-danger">*</span></label>
            <mat-select formControlName="role_id" class="form-control select" placeholder="Select Role">
              <mat-option *ngFor="let data of roles" [value]="data.id">
                {{data.name}}
              </mat-option>
            </mat-select>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4">
          <div class="form-group local-forms">
            <label>Especialidades <span class="login-danger">*</span></label>
            <mat-select formControlName="specialitie_id" class="form-control select" placeholder="Select Speciality">
              <mat-option *ngFor="let data of specialities" [value]="data.id">
                {{data.name}}
              </mat-option>
            </mat-select>
          </div>
        </div>
        <div class="col-12 col-sm-12">
          <div class="form-group local-forms">
            <label>Dirección <span class="login-danger">*</span></label>
            <textarea class="form-control" formControlName="address" rows="3" cols="30"></textarea>
          </div>
        </div>

        <div class="col-12 col-md-6 col-xl-6">
          <div class="form-group local-top-form">
            <label class="local-top">Avatar (Opcional)</label>
            <div class="settings-btn upload-files-avator">
              <input type="file" accept="image/*" name="image" id="file" (change)="loadFile($event)" class="hide-input">
              <label for="file" class="upload">Elegir imagen</label>
            </div>
          </div>
          <div class="" *ngIf="fileAvatar">
            <img [src]="imagenPrev" width="250" alt="" srcset="">
          </div>
        </div>

        <div class="col-12">
          <div class="doctor-submit text-end">
            <button type="button" (click)="save()" class="btn btn-primary submit-form me-2">Guardar</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
